services:
  - type: web
    name: pricehawk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CHECK_MINUTES
        value: "60"
